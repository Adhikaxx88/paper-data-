networks:
  ragnet:
    driver: bridge

# NOTE: pipeline/backend embed natively via sentence-transformers/fastembed
# (for direct GPU access) instead of a separate embedding container. They
# still run here by default on CPU; for GPU passthrough inside these
# containers, add `deploy.resources.reservations.devices` (NVIDIA runtime)
# to the pipeline/backend services below, or run them on the host instead.
volumes:
  pgdata:
  qdrantdata:
  hf_cache:
  st_cache:
  fastembed_cache:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragnet

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6335:6333"
    healthcheck:
      # The qdrant/qdrant image ships neither curl nor wget — a curl-based
      # check always fails with "curl: not found" and leaves the container
      # permanently "unhealthy" even when the service is fine. bash (present
      # in the image) can open a raw TCP socket via /dev/tcp instead.
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/localhost/6333) 2>/dev/null || exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragnet

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    env_file:
      - .env
    environment:
      # Override host-oriented values from .env (meant for scripts run
      # outside docker, e.g. setup-db.py) with in-network addresses.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      # Model caches — no USER directive in Dockerfile.pipeline, so it runs
      # as root and HOME=/root; these are the default cache paths
      # huggingface_hub/sentence-transformers/fastembed write to. Without
      # this, the dense (multilingual-e5-large) and reranker
      # (bge-reranker-v2-m3) models re-download on every container restart.
      - hf_cache:/root/.cache/huggingface
      - st_cache:/root/.cache/torch/sentence_transformers
      # fastembed (sparse BM25 model, encode_sparse()) ignores HF_HOME and
      # defaults to /tmp/fastembed_cache instead — /tmp doesn't survive a
      # container recreate, so without this mount it re-downloads there too.
      - fastembed_cache:/tmp/fastembed_cache
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    profiles:
      - pipeline
    command: python run_pipeline.py
    networks:
      - ragnet

  evaluation:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./evaluation:/app/evaluation
    depends_on:
      postgres:
        condition: service_healthy
    command: python evaluation/generate_dataset.py
    networks:
      - ragnet

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      # Override host-oriented values from .env (meant for scripts run
      # outside docker, e.g. setup-db.py) with in-network addresses.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      # Bind-mount source for hot reload. Mounted per-directory (not the
      # whole repo root) since backend/main.py imports config, db, rag, and
      # vectorization as top-level packages living next to backend/, not
      # inside it — a single ./backend:/app mount would remove those from
      # the container and break every import.
      - ./backend:/app/backend
      - ./db:/app/db
      - ./rag:/app/rag
      - ./vectorization:/app/vectorization
      - ./config.py:/app/config.py
      - ./scripts:/app/scripts
      # Model caches — same reasoning as the pipeline service: without
      # these, the dense/reranker models re-download every restart since
      # backend/main.py loads them at startup (get_dense_model()).
      - hf_cache:/root/.cache/huggingface
      - st_cache:/root/.cache/torch/sentence_transformers
      # fastembed (sparse BM25 model, encode_sparse() via rag/retriever.py)
      # ignores HF_HOME and defaults to /tmp/fastembed_cache — /tmp doesn't
      # survive a container recreate, so without this it re-downloads there.
      - fastembed_cache:/tmp/fastembed_cache
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ragnet

  frontend:
    # node:20-alpine (musl libc) fails here: package-lock.json was resolved
    # against this host's glibc Linux (WSL), and native optional deps like
    # lightningcss don't reliably get their musl build installed on top of
    # that lock, crashing Vite at startup ("Cannot find module
    # '../lightningcss.linux-x64-musl.node'"). A glibc-based image matches
    # what the lockfile already expects.
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Anonymous volume so the container's own npm-installed node_modules
      # isn't shadowed by the host's bind-mounted node_modules, which may
      # hold native binaries built for a different platform.
      - /app/node_modules
    # --host is required so Vite's dev server accepts connections from
    # outside the container, not just localhost inside it.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - ragnet
